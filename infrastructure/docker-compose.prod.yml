version: "3.9"
# Production overrides — use alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  api:
    restart: always
    deploy:
      replicas: 3
    environment:
      - ENV=production

  worker:
    restart: always
    deploy:
      replicas: 4

  frontend:
    restart: always

  postgres:
    restart: always

  redis:
    restart: always
