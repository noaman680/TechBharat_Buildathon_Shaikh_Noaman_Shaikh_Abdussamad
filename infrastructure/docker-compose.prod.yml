version: "3.9"
# Production overrides — use with:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      DEBUG: "false"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  frontend:
    environment:
      NODE_ENV: production

  worker-llm:
    deploy:
      replicas: 3

  postgres:
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 4G
