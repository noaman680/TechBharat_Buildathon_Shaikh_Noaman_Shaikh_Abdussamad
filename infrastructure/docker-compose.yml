version: "3.9"

services:

  # ── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - uploads:/app/uploads
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://meetmind:meetmind@postgres:5432/meetmind
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      LOCAL_STORAGE_PATH: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker (LLM tasks) ────────────────────────────────────────────
  worker-llm:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery celery_app worker -Q llm,integration -c 4 --loglevel=info
    volumes:
      - ../backend:/app
      - uploads:/app/uploads
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://meetmind:meetmind@postgres:5432/meetmind
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      LOCAL_STORAGE_PATH: /app/uploads
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # ── Celery Worker (GPU — Whisper) ─────────────────────────────────────────
  worker-gpu:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery celery_app worker -Q gpu -c 1 --loglevel=info
    volumes:
      - ../backend:/app
      - uploads:/app/uploads
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://meetmind:meetmind@postgres:5432/meetmind
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/uploads
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ── Celery Flower (monitoring) ────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
    command: celery --broker=redis://redis:6379/0 flower

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meetmind
      POSTGRES_USER: meetmind
      POSTGRES_PASSWORD: meetmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Qdrant (Vector DB) ────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Neo4j (Knowledge Graph) ───────────────────────────────────────────────
  neo4j:
    image: neo4j:5.24
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/meetmind123
      NEO4J_PLUGINS: '["apoc"]' 
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  uploads:
