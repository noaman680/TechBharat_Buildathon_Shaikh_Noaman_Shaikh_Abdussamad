version: "3.9"
services:
  api:
    build: ../backend
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql://meetmind:meetmind@postgres:5432/meetmind
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on: [postgres, redis, qdrant, neo4j]

  worker:
    build: ../backend
    command: celery -A app.worker.celery worker --loglevel=info -Q transcription,extraction
    environment:
      - DATABASE_URL=postgresql://meetmind:meetmind@postgres:5432/meetmind
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on: [postgres, redis]

  frontend:
    build: ../frontend
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on: [api]

  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/app/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      - POSTGRES_USER=meetmind
      - POSTGRES_PASSWORD=meetmind
      - POSTGRES_DB=meetmind
    ports: ["5432:5432"]

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
    environment:
      - NEO4J_AUTH=neo4j/meetmind
    volumes: [neo4j_data:/data]

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
