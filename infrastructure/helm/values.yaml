image:
  repository: ghcr.io/meetmind/api
  tag: latest
  pullPolicy: IfNotPresent

replicaCount:
  api: 2
  worker: 2

resources:
  api:
    requests: { cpu: "500m", memory: "512Mi" }
    limits: { cpu: "2", memory: "2Gi" }
  worker:
    requests: { cpu: "1", memory: "2Gi" }
    limits: { cpu: "4", memory: "8Gi" }

autoscaling:
  worker:
    minReplicas: 2
    maxReplicas: 20
    targetQueueLength: 5

postgres:
  enabled: true
qdrant:
  enabled: true
neo4j:
  enabled: true
