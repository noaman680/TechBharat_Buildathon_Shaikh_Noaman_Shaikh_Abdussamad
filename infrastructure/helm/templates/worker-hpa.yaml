# Horizontal Pod Autoscaler — scale workers based on queue depth
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meetmind-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meetmind-worker
  minReplicas: {{ .Values.autoscaling.worker.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.worker.maxReplicas }}
  metrics:
    - type: External
      external:
        metric:
          name: redis_queue_length
          selector:
            matchLabels: { queue: transcription }
        target:
          type: AverageValue
          averageValue: "{{ .Values.autoscaling.worker.targetQueueLength }}"
