[project]
name = "meetmind-backend"
version = "1.0.0"
description = "Agentic AI Meeting Assistant — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "langgraph==0.2.28",
    "langgraph-checkpoint-postgres==1.0.4",
    "anthropic==0.34.2",
    "openai==1.47.0",
    "celery==5.4.0",
    "redis==5.0.8",
    "qdrant-client==1.11.2",
    "neo4j==5.24.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "pgvector==0.3.4",
    "boto3==1.35.24",
    "python-multipart==0.0.9",
    "python-jose[cryptography]==3.3.0",
    "langfuse==2.48.0",
    "prometheus-client==0.20.0",
    "opentelemetry-sdk==1.27.0",
    "sentry-sdk[fastapi]==2.14.0",
    "rapidfuzz==3.9.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.8",
    "pre-commit==3.8.0",
]
