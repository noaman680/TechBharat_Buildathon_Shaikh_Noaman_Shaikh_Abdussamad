[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetmind-backend"
version = "0.1.0"
description = "MeetMind Agentic AI Meeting Assistant - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langsmith>=0.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[asyncio]>=5.0.0",
    "openai>=1.40.0",
    "openai-whisper>=20231117",
    "pyannote.audio>=3.1.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "qdrant-client[fastembed]>=1.11.0",
    "neo4j>=5.0.0",
    "dateparser>=1.2.0",
    "pytz>=2024.1",
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "structlog>=24.0.0",
    "boto3>=1.34.0",
    "aiofiles>=24.0.0",
    "thefuzz>=0.22.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
